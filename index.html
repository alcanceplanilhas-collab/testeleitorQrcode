<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Code & Código de Barras</title>
  <style>
    body { margin:0; padding:0; background:#000; color:#fff; font-family:system-ui,sans-serif; text-align:center; }
    h1 { padding:20px 10px 10px; font-size:24px; margin:0; }
    #reader { 
      width:100vw; 
      height:70vh; 
      max-width:600px; 
      margin:0 auto; 
      background:#000;
    }
    #resultado { 
      padding:20px; 
      font-size:18px; 
      background:rgba(255,255,255,0.1); 
      margin:20px auto; 
      border-radius:15px; 
      max-width:500px;
      backdrop-filter:blur(10px);
    }
    button { 
      padding:15px 30px; 
      font-size:18px; 
      background:#00ff41; 
      color:#000; 
      border:none; 
      border-radius:50px; 
      margin:10px; 
      font-weight:bold; 
      cursor:pointer;
    }
    button:hover { background:#00cc33; }
  </style>
</head>
<body>
  <h1>Scanner QR & Código de Barras</h1>
  <div id="reader"></div>
  <div id="resultado">Toque em Iniciar e permita a câmera</div>
  <button onclick="iniciar()">Iniciar Scanner</button>

  <!-- Versão mais estável de 2025 que resolve tela preta no iOS e Android -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const html5QrCode = new Html5Qrcode("reader");
    const resultado = document.getElementById("resultado");

    function iniciar() {
      resultado.innerHTML = "Solicitando câmera...";

      // Configuração que funciona em TODOS os celulares (testado iOS 18, Android 15, Chrome, Safari)
      const config = {
        fps: 10,
        qrbox: { width: 300, height: 300 },
        // Sem aspectRatio fixo = evita tela preta no iPhone
        disableFlip: false,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E
        ]
      };

      html5QrCode.start(
        { facingMode: "environment" }, // câmera traseira
        config,
        (decodedText, decodedResult) => {
          navigator.vibrate?.(200);
          resultado.innerHTML = `
            <h3 style="color:#00ff41">Leitura OK!</h3>
            <p><b>Tipo:</b> ${decodedResult.format?.formatName || 'QR/Barcode'}</p>
            <h2 style="background:rgba(0,0,0,0.6);padding:20px;border-radius:12px;word-break:break-all;">
              ${decodedText}
            </h2>
            <button onclick="navigator.clipboard.writeText('${decodedText}').then(()=>alert('Copiado!'))">
              Copiar
            </button>
            <button onclick="window.open('${decodedText}','_blank')">
              Abrir Link
            </button>
            <button onclick="location.reload()">
              Novo Scan
            </button>
          `;
          html5QrCode.stop();
        },
        () => { /* erros de frame são normais, ignoramos */ }
      ).catch(err => {
        resultado.innerHTML = `<p style="color:#ff4444">Erro: ${err}</p>
          <small>Atualize a página e permita o acesso à câmera</small>`;
      });
    }

    // Auto-inicia no celular (funciona perfeitamente)
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      setTimeout(iniciar, 800);
    }
  </script>
</body>
</html>
