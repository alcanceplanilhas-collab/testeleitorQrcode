<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner</title>

<style>
  body {
    background: #000;
    color: #0f0;
    font-family: Arial;
    text-align: center;
    padding: 20px;
  }
  #reader {
    width: 300px;
    margin: auto;
  }
  #resultado {
    margin-top: 20px;
    background: #111;
    padding: 20px;
    border-radius: 12px;
    color: #0f0;
    word-break: break-all;
    font-size: 18px;
  }
  button {
    padding: 12px 25px;
    font-size: 18px;
    background: #0f0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
</style>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

</head>
<body>

<h1>Leitor QRCode</h1>

<div id="reader"></div>

<button onclick="iniciar()">INICIAR SCAN</button>

<div id="resultado"></div>

<script>
let scannerAtivo = false;
let html5QrCode;

async function iniciar() {
  try {
    if (scannerAtivo) return;

    document.getElementById("resultado").innerHTML = "";
    scannerAtivo = true;

    html5QrCode = new Html5Qrcode("reader");

    const videoConfig = { facingMode: "environment" };

    html5QrCode.start(
      videoConfig,
      { fps: 10, qrbox: 250 },

      // ======= CALLBACK DO RESULTADO =======
      (decodedText, decodedResult) => {
        console.log("Lido:", decodedText);

        // PARA TUDO
        html5QrCode.stop().catch(() => {});
        scannerAtivo = false;

        // MOSTRA NA TELA
        document.getElementById("resultado").innerHTML = `
          <h2 style="color:#0f0">Código detectado:</h2>
          <div style="font-size:22px;">${decodedText}</div>
        `;
      },

      // ======= CALLBACK DE ERRO =======
      (error) => {
        console.log("Buscando...", error);
      }
    );

  } catch (e) {
    console.error(e);
    document.getElementById("resultado").innerHTML =
      "Erro ao iniciar o scanner";
  }
}
</script>

</body>
</html>
